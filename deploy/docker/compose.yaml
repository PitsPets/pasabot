# PasaBot with Docker Compose. From this folder (deploy/docker), so the seccomp path resolves:
#   docker compose up -d --build
# The ports are published on 127.0.0.1 only. Reach PasaBot from other devices through Tailscale serve or a tunnel
# (deploy/REMOTE-ACCESS.md); `docker compose exec pasabot pasabot doctor` checks the setup.
name: pasabot
services:
  pasabot:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: pasabot:local
    restart: unless-stopped
    init: true
    ports:
      - "${PASABOT_PUBLISH_HOST:-127.0.0.1}:${PASABOT_PORT:-7777}:7777"
      - "${PASABOT_PUBLISH_HOST:-127.0.0.1}:${PASABOT_SITES_PORT:-7778}:7778"
    environment:
      # where the ports are published, so `pasabot doctor` inside the container judges the real exposure
      PASABOT_PUBLISH_HOST: "${PASABOT_PUBLISH_HOST:-127.0.0.1}"
      PASABOT_ALLOWED_HOSTS: "${PASABOT_ALLOWED_HOSTS:-}"
      PASABOT_ALLOWED_ORIGINS: "${PASABOT_ALLOWED_ORIGINS:-}"
      PASABOT_PUBLIC_URL: "${PASABOT_PUBLIC_URL:-}"
    volumes:
      - pasabot-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp.json
      # load deploy/docker/apparmor/pasabot first (see its header), then set PASABOT_APPARMOR=pasabot
      - apparmor=${PASABOT_APPARMOR:-docker-default}
    pids_limit: 512
    mem_limit: "${PASABOT_MEM_LIMIT:-2g}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7777/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 3
volumes:
  pasabot-data:
