# Desktop proof on real Windows, Linux and macOS runners (W26). Kept in the repo; it runs when the owner pushes or
# starts it by hand. Unsigned artifacts only; nothing is published or uploaded anywhere else.
#   windows-latest: install, typecheck + build + the Windows tests, build-windows.ps1 (portable folder + installer), the
#                   installer silently, then selftest.ps1 against the installed copy, then a silent uninstall
#   ubuntu-latest:  install, run check, build-linux.sh, install.sh, selftest.sh
#   macos-latest:   install, desktop tests, build-app.sh + smoke.sh
name: desktop
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/desktop/**"
      - "apps/server/src/host/**"
      - "packages/core/src/**"
      - ".github/workflows/desktop.yml"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes pnpm@12.18.0 install --frozen-lockfile
      # not `run check`: pnpm runs scripts through cmd.exe here, which does not expand the "$npm_execpath" those
      # scripts use, so each step is run directly. The tests are the ones written for Windows (platform-injected,
      # or real Windows behaviour: no `ps`, taskkill, ACLs, shims); the POSIX-only ones (file modes, /bin/sh fake
      # CLIs, process groups) run on the Linux and macOS jobs. Lint is platform-independent and runs on Linux.
      - run: npx --yes pnpm@12.18.0 run typecheck
      - run: npx --yes pnpm@12.18.0 run i18n:check
      - run: npx --yes pnpm@12.18.0 -r run build
      - run: npx --yes pnpm@12.18.0 vitest run packages/core/src/win.test.ts apps/server/src/host/notices.test.ts apps/desktop/src/windows.test.ts apps/desktop/src/shells.test.ts modules/procs
      - run: choco install innosetup --no-progress -y
      - name: build the package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\desktop\windows\build-windows.ps1 -SkipBuild
      - name: install it silently (per user, no admin)
        shell: powershell
        run: |
          $setup = Get-ChildItem apps\desktop\out\PasaBot-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
      - name: selftest on the installed copy
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\Programs\PasaBot\selftest.ps1"
      - name: no node.exe left from the installed copy
        shell: powershell
        run: |
          $left = Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.CommandLine -like "*Programs\PasaBot*" }
          if ($left) { $left | Format-List ProcessId, CommandLine; throw 'node.exe left running' }
      - name: uninstall silently (data is kept)
        shell: powershell
        run: |
          $u = "$env:LOCALAPPDATA\Programs\PasaBot\unins000.exe"
          $p = Start-Process $u -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exit $($p.ExitCode)" }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pasabot-windows
          path: |
            apps/desktop/out/PasaBot-Setup-*.exe
            ${{ env.LOCALAPPDATA }}/Programs/PasaBot/selftest-report.txt
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the helper sandbox on Ubuntu 24.04 needs bubblewrap with user namespaces (the app shows a card otherwise)
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npx --yes pnpm@12.18.0 install --frozen-lockfile
      - run: npx --yes pnpm@12.18.0 run check
      - run: bash apps/desktop/linux/build-linux.sh
      - name: install for this user and check the computer
        run: |
          mkdir -p "$RUNNER_TEMP/pb" && tar -C "$RUNNER_TEMP/pb" -xzf apps/desktop/out/pasabot-linux-*.tar.gz
          "$RUNNER_TEMP/pb/pasabot/install.sh"
          test -f "$HOME/.local/share/applications/pasabot.desktop"
          DISPLAY=:99 XDG_CURRENT_DESKTOP=ci "$HOME/.local/share/pasabot/selftest.sh"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pasabot-linux
          path: |
            apps/desktop/out/pasabot-linux-*.tar.gz
            ~/.local/share/pasabot/selftest-report.txt
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes pnpm@12.18.0 install --frozen-lockfile
      - run: npx --yes pnpm@12.18.0 vitest run apps/desktop
      - run: bash apps/desktop/macos/build-app.sh --payload copy --dmg
      - run: bash apps/desktop/macos/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pasabot-macos
          path: apps/desktop/out/*.dmg
