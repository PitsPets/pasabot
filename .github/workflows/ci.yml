name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: install
        run: npx --yes pnpm@12.18.0 install --frozen-lockfile
      # Before any test: the runner sandbox needs bubblewrap, and both bubblewrap and Chromium's own sandbox
      # (modules/browser launches it with chromiumSandbox: true) need unprivileged user namespaces, which Ubuntu 24.04
      # restricts through AppArmor.
      - name: install bubblewrap, allow user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "::warning::could not relax kernel.apparmor_restrict_unprivileged_userns"
      # pnpm install brings playwright-core but not its browser: the real-Chromium tests in modules/browser need the
      # headless shell of the playwright-core version pinned there, plus its system libraries
      - name: install Playwright's Chromium headless shell
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --yes pnpm@12.18.0 --filter @pasabot/mod-browser exec playwright-core install --with-deps --only-shell chromium
      # each check runs once the install worked, whatever the check before it said, so one run shows every problem
      - name: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --yes pnpm@12.18.0 run typecheck
      - name: i18n:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --yes pnpm@12.18.0 run i18n:check
      - name: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --yes pnpm@12.18.0 run lint
      - name: unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --yes pnpm@12.18.0 run test
      # the runner sandbox is a required check: PASABOT_REQUIRE_SANDBOX=1 makes a missing or broken bwrap fail
      # test:sandbox instead of skipping it
      - name: test:sandbox (required)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --yes pnpm@12.18.0 run test:sandbox
        env:
          PASABOT_REQUIRE_SANDBOX: "1"
      - name: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --yes pnpm@12.18.0 run build
